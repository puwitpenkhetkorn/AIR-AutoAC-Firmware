; CLAUDE.md: qio_opi สำหรับ N16R8 (ห้ามใช้ qio_qspi บนบอร์ดจริง — บูตวน)

[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_16mb.csv ; NVS เดิม 20KB เล็กไปสำหรับตารางเรียนใหม่ (สูงสุด 350 คาบ) — ขยายเป็น 256KB (flash ใหม่ล้าง NVS เดิมทิ้งหมด)
board_upload.offset_address = 0x50000 ; PlatformIO hardcode 0x10000 เป็นค่า default ของ esptool upload offset — ไม่ได้อ่านจาก partitions.csv เอง ต้องตั้งเองให้ตรงกับ app0 ในตารางด้านบน (ไม่งั้น firmware ไปอยู่คนละที่กับที่ bootloader จะโหลด → บูตวนไม่มี log เลย)
lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.1.0
  adafruit/DHT sensor library @ ^1.4.6
  adafruit/Adafruit Unified Sensor @ ^1.1.14
  lovyan03/LovyanGFX @ ^1.1.16
  crankyoldgit/IRremoteESP8266 @ ^2.8.6
  adafruit/RTClib @ ^2.1.4
  adafruit/Adafruit AMG88xx Library @ ^1.2.1
  adafruit/Adafruit NeoPixel @ ^1.12.3

[env:autoac]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags = -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1

[env:autoac_bench]
; บอร์ดจริงบนโต๊ะ ไม่ต่อจอ/ทัช — กัน setup() ค้างรอ calibrate (CLAUDE.md)
; ARDUINO_USB_CDC_ON_BOOT=1 ให้ Serial ออกทาง USB-CDC จริง (ตรงกับ "USB CDC On Boot: Enabled" ใน CLAUDE.md)
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
  -DBOARD_HAS_PSRAM
  -DAUTOAC_NO_DISPLAY
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:wokwi]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags = -DAUTOAC_NO_DISPLAY -DAUTOAC_WOKWI

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
